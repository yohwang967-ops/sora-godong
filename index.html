<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>마법의 소라고동</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;800&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: one screen. The shell rests in still water at the centre, whatever it says
   appears directly beneath it, and the few controls stay out at the edges. */
:root{
  --water:#D5ECE6; --water-deep:#A6D3CC;
  --ink:#0D2A33; --ink-soft:#3F6068;
  --surface:#EEF8F5; --line:#0D2A3329;
  --pearl:#FCF2E5; --pearl-shade:#E9CDB3; --shell-line:#6E4B40;
  --lip:#F28C7C; --lip-deep:#C4505C; --on-lip:#2B0E13;
  --ok:#1C7560;
  --font-oracle:"Hahmlet","Nanum Myeongjo","AppleMyungjo","Batang",serif;
  --font-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --water:#0E313B; --water-deep:#061B22;
    --ink:#E9F3EF; --ink-soft:#9FBDBA;
    --surface:#123741; --line:#E9F3EF30;
    --pearl:#F4E7D7; --pearl-shade:#D8B99E; --shell-line:#4A2F2A;
    --lip:#F28C7C; --lip-deep:#C4505C; --on-lip:#2B0E13;
    --ok:#6FD3B4;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --water:#0E313B; --water-deep:#061B22;
  --ink:#E9F3EF; --ink-soft:#9FBDBA;
  --surface:#123741; --line:#E9F3EF30;
  --pearl:#F4E7D7; --pearl-shade:#D8B99E; --shell-line:#4A2F2A;
  --lip:#F28C7C; --lip-deep:#C4505C; --on-lip:#2B0E13;
  --ok:#6FD3B4;
  color-scheme:dark;
}

html,body{height:100%}
body{
  background:var(--water-deep);
  background-image:radial-gradient(120% 75% at 50% 36%, var(--water) 0%, var(--water-deep) 100%);
  background-attachment:fixed;
  color:var(--ink);
  font-family:var(--font-ui);
  font-size:16px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
p,h1,h2{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

.app{
  min-height:100%;
  display:grid;
  grid-template-rows:auto 1fr auto;
  gap:8px;
  padding-block:14px 18px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  overflow-x:clip;
}

/* ---------- top ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.mark{font-family:var(--font-oracle);font-weight:500;font-size:.95rem;letter-spacing:.14em}
.top-actions{display:flex;gap:4px}
.chip{
  background:none;border:0;padding:8px 10px;border-radius:999px;
  font-size:.875rem;color:var(--ink-soft);cursor:pointer;
}
.chip:hover{color:var(--ink);background:var(--line)}
.chip b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}

/* ---------- stage ---------- */
.stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;min-width:0}
.shell-wrap{position:relative;width:min(66vw, 38vh, 290px);aspect-ratio:1;max-width:100%;margin-bottom:18px}
.ring{position:absolute;border-radius:50%;border:1.5px solid var(--line);pointer-events:none}
.ring.r1{inset:0}
.ring.r2{inset:-8%;opacity:.6}
.ring.r3{inset:-16%;opacity:.3}
.shell{position:absolute;inset:0;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.shell svg{display:block;width:100%;height:100%;overflow:visible;transition:filter .5s}
/* the shell pivots on the tip of its canal, where the cord is tied (68% / 88% of the square) */
.tilt{transform-box:view-box;transform-origin:68% 88%;transition:transform .45s cubic-bezier(.3,1.5,.5,1)}
.bob{animation:bob 4.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(3px)}50%{transform:translateY(-5px)}}
.prog{fill:none;stroke:var(--lip);stroke-width:5;stroke-linecap:round;stroke-dasharray:967.6;stroke-dashoffset:967.6;transition:stroke-dashoffset .35s}

/* ---------- the cord ---------- */
.pull{position:absolute;inset:0;pointer-events:none;z-index:2;--rest:30px}
.cord{
  position:absolute;left:68%;top:87.5%;width:3px;margin-left:-1.5px;border-radius:2px;
  background:var(--shell-line);
  height:calc(var(--rest) + var(--pull, 0px));
  transition:height .4s cubic-bezier(.3,1.5,.5,1);
}
.handle{
  position:absolute;left:68%;top:calc(87.5% + var(--rest) - 20px);margin-left:-24px;
  width:48px;height:48px;display:grid;place-items:center;
  background:none;border:0;padding:0;border-radius:50%;
  pointer-events:auto;touch-action:none;cursor:grab;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  transform:translateY(var(--pull, 0px));
  transition:transform .4s cubic-bezier(.3,1.5,.5,1), opacity .4s;
}
.bead{
  width:27px;height:27px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #fff 0, var(--pearl) 38%, var(--pearl-shade) 100%);
  border:3px solid var(--shell-line);
}
.ready .bead{background:var(--lip)}
[data-state="idle"] .bead{animation:tug 3.4s ease-in-out infinite}
@keyframes tug{0%,72%,100%{transform:none}82%{transform:translateY(6px)}92%{transform:none}}
.listening .cord,.listening .handle,.listening .prog{transition:none}
.listening .handle{cursor:grabbing}
.listening .bob{animation-play-state:paused}
.listening .bead{animation:none}
[data-state="sulk"] .handle{opacity:.45;cursor:not-allowed}
.s-body{fill:url(#pearl);stroke:var(--shell-line);stroke-width:3.2;stroke-linejoin:round}
.s-flare{fill:var(--pearl);stroke:var(--shell-line);stroke-width:3.2;stroke-linejoin:round}
.s-knob{fill:var(--pearl-shade);stroke:var(--shell-line);stroke-width:3.2}
.s-lip{fill:var(--lip);stroke:var(--shell-line);stroke-width:3.2;stroke-linejoin:round}
.s-deep{fill:var(--lip-deep)}
.s-groove{fill:none;stroke:var(--pearl-shade);stroke-width:3.2;stroke-linecap:round}
.s-shine{fill:none;stroke:#fff;stroke-opacity:.75;stroke-width:4;stroke-linecap:round}

.listening .tilt{transform:rotate(5deg)}
.listening .ring{animation:pulse 1s ease-out infinite;border-color:var(--lip)}
.listening .ring.r2{animation-delay:.33s}
.listening .ring.r3{animation-delay:.66s}
@keyframes pulse{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.14);opacity:0}}
[data-state="sulk"] .shell svg{filter:saturate(.2) brightness(.92)}
[data-state="sulk"] .tilt{transform:rotate(-7deg)}
[data-state="sulk"] .bob{animation:none}
.nudge{animation:nudge .42s ease}
@keyframes nudge{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}60%{transform:translateX(6px)}}

/* ---------- what the conch says ---------- */
.voice{
  width:100%;max-width:34rem;min-height:11.5rem;min-width:0;
  display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;
}
.eyebrow{font-size:.8125rem;letter-spacing:.06em;color:var(--ink-soft);min-height:1.3em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.say{
  font-family:var(--font-oracle);font-weight:800;
  font-size:clamp(1.65rem, 6.4vw, 2.5rem);line-height:1.32;
  word-break:keep-all;overflow-wrap:anywhere;text-wrap:balance;max-width:100%;
}
.say[data-kind="hint"]{font-weight:500;font-size:clamp(1.2rem, 4.6vw, 1.5rem)}
.say.rise{animation:rise .7s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.sub{font-size:.9375rem;color:var(--ink-soft);word-break:keep-all;text-wrap:balance;font-variant-numeric:tabular-nums}
.acts{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:6px}
.btn{
  border:1.5px solid transparent;border-radius:999px;padding:11px 24px;min-height:46px;
  font-weight:600;font-size:1rem;cursor:pointer;transition:transform .12s;
}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--lip);color:var(--on-lip)}
.btn.ghost{background:none;border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{border-color:var(--ink-soft)}
.btn.danger{background:var(--ink);color:var(--water)}

.ask{width:100%;max-width:26rem}
.ask input{
  width:100%;background:none;border:0;border-bottom:1.5px solid var(--line);border-radius:0;
  padding:10px 2px;text-align:center;font-size:1rem;color:var(--ink);
}
.ask input::placeholder{color:var(--ink-soft);opacity:.85}
.ask input:focus{outline:none;border-bottom-color:var(--lip)}

/* ---------- bottom: strength ---------- */
.bottom{display:flex;justify-content:center}
.level{border:0;margin:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.level legend{padding:0;margin:0 auto 6px;font-size:.75rem;letter-spacing:.14em;color:var(--ink-soft)}
.seg{display:flex;border:1.5px solid var(--line);border-radius:999px;padding:3px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{padding:7px 18px;border-radius:999px;font-size:.9375rem;font-weight:500;color:var(--ink-soft);cursor:pointer}
.seg input:checked + label{background:var(--ink);color:var(--water)}
.seg input:focus-visible + label{outline:2px solid var(--lip);outline-offset:2px}
.level-note{font-size:.8125rem;color:var(--ink-soft);text-align:center;word-break:keep-all}

:is(.chip,.btn,.handle,.sheet-close):focus-visible{outline:2px solid var(--lip);outline-offset:3px}

/* ---------- record sheet ---------- */
.backdrop{position:fixed;inset:0;background:#06191f80;z-index:20}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:21;margin-inline:auto;
  width:100%;max-width:35rem;max-height:80%;
  display:flex;flex-direction:column;gap:14px;
  background:var(--surface);color:var(--ink);
  border-radius:22px 22px 0 0;
  padding-top:20px;
  padding-bottom:calc(20px + env(safe-area-inset-bottom, 0px));
  padding-left:max(20px, env(safe-area-inset-left, 0px));
  padding-right:max(20px, env(safe-area-inset-right, 0px));
  box-shadow:0 -12px 40px #06191f40;
}
.sheet-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sheet h2{font-family:var(--font-oracle);font-weight:800;font-size:1.25rem}
.sheet-close{background:none;border:0;padding:6px 10px;border-radius:999px;color:var(--ink-soft);cursor:pointer;font-size:.9375rem}
.tally{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.875rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.tally b{color:var(--ink);font-weight:600}
.log{list-style:none;margin:0;padding:0;overflow-y:auto;display:flex;flex-direction:column;min-height:0}
.log li{display:grid;grid-template-columns:4.6rem 1fr;gap:4px 12px;padding:12px 0;border-top:1px solid var(--line)}
.log p{min-width:0;word-break:keep-all;overflow-wrap:anywhere;font-weight:500}
.log time{grid-column:2;font-size:.8125rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.st{font-size:.8125rem;font-weight:600;padding-top:2px}
.st::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:currentColor}
.st-done{color:var(--ok)}
.st-defied{color:var(--lip-deep)}
.st-lapsed,.st-asked{color:var(--ink-soft)}
.st-lapsed::before{background:none;border:1.5px solid currentColor}
.empty{padding:18px 0 8px;color:var(--ink-soft);border-top:1px solid var(--line)}

@media (max-height:640px){
  .stage{gap:14px}
  .voice{min-height:9.5rem}
  .shell-wrap{width:min(54vw, 32vh, 290px)}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}
</style>

<div class="app" id="app" data-state="idle">
  <header class="top">
    <h1 class="mark">마법의 소라고동</h1>
    <div class="top-actions">

      </div>
      <div class="pull bob">
        <span class="cord"></span>
        <button class="handle" id="handle" type="button" aria-label="소라고동의 줄. 끝까지 당겼다 놓으면 소라고동이 말한다. 키보드로는 스페이스를 누르고 있다가 뗀다.">
          <span class="bead"></span>
        </button>
      </div>
    </div>

    <section class="voice">
      <p class="eyebrow" id="eyebrow"></p>
      <p class="say" id="say" data-kind="hint" aria-live="polite"></p>

    <form class="ask" id="askForm" autocomplete="off">
      <label class="sr" for="q">소라고동에게 허락받을 것</label>

  </main>

  <footer class="bottom">

      <div class="seg">
        <input type="radio" name="lv" id="lv1" value="1"><label for="lv1">순하게</label>

</div>

<div class="backdrop" id="backdrop" hidden></div>

    <h2 id="sheetTitle">신탁의 기록</h2>
    <button class="sheet-close" id="sheetClose" type="button">닫기</button>
  </div>
  <div class="tally" id="tally"></div>
  <ul class="log" id="logList"></ul>
</div>

<script>
(function(){
  'use strict';

  /* ------------------------------------------------------------------
     신탁 목록. lv: 1 순하게 / 2 보통 / 3 맵게
     h: [시작 시, 끝 시) 그 시간대에만 나온다. d: 'we' 주말, 'wd' 평일.

  ------------------------------------------------------------------ */
  var OUT = [8, 21], CALL = [9, 21], EVE = [18, 24];

    {t:'안 입는 옷 세 벌을 골라 내놓아라.', lv:1},
    {t:'휴대폰 사진 서른 장을 지워라.', lv:1},

  function button(label, kind, fn){

  /* ---------- actions ---------- */

    var o = pick();
    S.active = {text:o.t, lv:o.lv, at:Date.now()};

    qInput.value = ''; qInput.blur();
    view = {kind:'answer', q:q, a:a};
    save(); render(); chime(); buzz(40);

      clearInterval(sulkTimer);
      view = {kind:'flash', text:'소라고동이 다시 입을 열었다.', sub:'줄을 당겨라.'};

  }

  var FULL = 0.98, KEY_PULL_MS = 800;

  handle.addEventListener('lostpointercapture', function(){ if (!byKey) endPull(); });
  handle.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  handle.addEventListener('keydown', function(e){
    if (e.key !== ' ' && e.key !== 'Enter') return;
    e.preventDefault();
    if (e.repeat || !startPull()) return;
    byKey = true; keyStart = performance.now();
    (function step(){
      if (!pulling) return;
      setPull((performance.now() - keyStart) / KEY_PULL_MS);
      if (pull < 1) raf = requestAnimationFrame(step);
    })();
  });
  handle.addEventListener('keyup', function(e){ if (e.key === ' ' || e.key === 'Enter') endPull(); });
  handle.addEventListener('blur', endPull);
  // 소라고동 몸통을 누르면 줄이 어디 있는지 알려 준다.
  shell.addEventListener('click', function(){
    if (pulling) return;
    if (sulking()) { nudge(); return; }
    handle.classList.remove('nudge'); void handle.offsetWidth; handle.classList.add('nudge');
  });

  askForm.addEventListener('submit', function(e){
    e.preventDefault();
    if (sulking()) { nudge(); return; }
    var q = qInput.value.trim();
    if (q) answer(q);
  });

  /* ---------- controls ---------- */
  soundBtn.addEventListener('click', function(){
    S.sound = !S.sound; if (!S.sound) sea(false);
    save(); render();
  });
  document.querySelectorAll('input[name="lv"]').forEach(function(r){
    r.addEventListener('change', function(){ S.level = Number(r.value); save(); render(); });
  });

  function openSheet(){
    var counts = {done:0, defied:0, lapsed:0};
    S.log.forEach(function(e){ if (e.k === 'o' && counts[e.st] !== undefined) counts[e.st]++; });
    var total = counts.done + counts.defied + counts.lapsed;
    tally.replaceChildren();
    [['받은 신탁', total], ['행함', counts.done], ['거역', counts.defied], ['흘려보냄', counts.lapsed]].forEach(function(pair){
      var s = document.createElement('span'), b = document.createElement('b');
      b.textContent = pair[1]; s.append(pair[0] + ' ', b); tally.append(s);
    });
    logList.replaceChildren();
    if (!S.log.length) {
      var empty = document.createElement('li');
      empty.className = 'empty'; empty.style.display = 'block';
      empty.textContent = '아직 받은 신탁이 없다. 받은 것과 행한 것, 거역한 것이 여기에 남는다.';
      logList.append(empty);
    }
    S.log.slice().reverse().forEach(function(e){
      var li = document.createElement('li'), st = document.createElement('span'), p = document.createElement('p'), tm = document.createElement('time');
      st.className = 'st st-' + e.st; st.textContent = ST_NAME[e.st] || '';
      p.textContent = e.k === 'q' ? ('“' + e.text + '” → ' + e.a) : e.text;
      tm.textContent = stamp(e.at);
      li.append(st, p, tm); logList.append(li);
    });
    sheet.hidden = false; backdrop.hidden = false;
    $('sheetClose').focus();
  }
  function closeSheet(){ if (sheet.hidden) return; sheet.hidden = true; backdrop.hidden = true; logBtn.focus(); }
  logBtn.addEventListener('click', openSheet);
  $('sheetClose').addEventListener('click', closeSheet);
  backdrop.addEventListener('click', closeSheet);
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeSheet(); });

  /* ---------- boot ---------- */
  // 어제의 신탁은 오늘까지 따라오지 않는다. 흘려보낸 것으로 적고 비운다.
  if (S.active && dayKey(S.active.at) !== dayKey(Date.now())) {
    addLog({k:'o', text:S.active.text, lv:S.active.lv, st:'lapsed', at:S.active.at});
    S.active = null; save();
  }
  render();
  watchSulk();
})();
</script>

</body></html>
